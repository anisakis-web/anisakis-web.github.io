# Panel de noticias (Sveltia CMS). SOLO gestiona las noticias: crear, editar y borrar.
# El resto de la web se cambia editando el código del repositorio.
# Para entrar hace falta una cuenta de GitHub con permiso de escritura en este repositorio
# y una clave (token) limitada a él. Ver README.md, «Panel de noticias».

app_title: Panel de noticias · anisakis.com
logo:
  src: /icon-512.png
  show_in_header: true
show_preview_links: false

backend:
  name: github
  repo: anisakis-web/anisakis-web.github.io
  branch: main

# Imágenes de las noticias: se guardan en static/img/noticias y se publican en /img/noticias.
# Se convierten a WebP (máx. 1600 px) y el nombre se limpia (sin espacios ni acentos).
media_folder: static/img/noticias
public_folder: /img/noticias
media_libraries:
  default:
    config:
      max_file_size: 5000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

# Nombres de archivo y direcciones: solo letras sin acentos, números y guiones.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
  maxlength: 80

# Formato de los archivos: comillas dobles y sin campos vacíos (lo lee build.py).
output:
  omit_empty_optional_fields: true
  yaml:
    quote: double

collections:
  - name: noticias
    label: Noticias
    label_singular: Noticia
    description: Noticias de la web. Al guardar, la web se actualiza sola en uno o dos minutos.
    folder: content/noticias
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Borradores
        field: draft
        pattern: true
    fields:
      - name: title
        label: Título
        widget: string
        hint: Título de la noticia (se usa también para la dirección de la página).
      - name: date
        label: Fecha
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: image
        label: Imagen principal
        widget: image
        required: false
        choose_url: false
        accept: image/webp,image/jpeg,image/png,image/gif,image/avif
        hint: Opcional. Formato horizontal; se convierte a WebP automáticamente.
      - name: summary
        label: Resumen
        widget: text
        required: false
        hint: Opcional. 1–2 frases para la lista de noticias y Google. Si se deja vacío se usa el inicio del texto.
      - name: draft
        label: Borrador (no se publica)
        widget: boolean
        default: false
        required: false
      - name: body
        label: Texto
        widget: markdown
        hint: Solo texto (negrita, cursiva, subtítulos, listas y citas). Los enlaces van abajo, en «Fuentes y enlaces».
        buttons: [bold, italic, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: []
        modes: [rich_text]
      - name: enlaces
        label: Fuentes y enlaces
        label_singular: enlace
        widget: list
        required: false
        max: 12
        collapsed: false
        add_to_top: false
        hint: Fuentes de la noticia y, si hace falta, un vídeo o enlace relacionado. Solo direcciones https:// de webs reales (no se admiten acortadores ni archivos descargables).
        summary: "{{fields.tipo}} · {{fields.nombre}}"
        fields:
          - name: tipo
            label: Tipo
            widget: select
            default: fuente
            options:
              - { label: Fuente, value: fuente }
              - { label: Vídeo relacionado, value: video }
              - { label: Enlace relacionado, value: enlace }
          - name: nombre
            label: Nombre visible
            widget: string
            hint: "Ej.: elCorreo, RTVE, AZTI…"
            pattern: ['^.{1,80}$', 'Entre 1 y 80 caracteres']
          - name: url
            label: Dirección (https://…)
            widget: string
            pattern: ['^https://(?!(?:www\.)?(?:bit\.ly|bitly\.com|t\.co|tinyurl\.com|goo\.gl|ow\.ly|is\.gd|buff\.ly|cutt\.ly|shorturl\.at|rb\.gy|tiny\.cc|linktr\.ee)/)[^\s/@:]+\.[a-zA-Z]{2,}(/[^\s]*)?$', 'Debe ser la dirección completa de la web (https://…), sin acortadores como bit.ly']
